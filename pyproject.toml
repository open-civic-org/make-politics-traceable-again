[project]
name = "make-politics-traceable-again"
version = "0.1.0"
description = "Evidence-based tracker of elected representatives in India"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
  "pre-commit>=4.0.0",
  "mypy>=1.13.0",
  "pgserver>=0.1.4; python_version < '3.13'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "scripts", "tests", "collectors"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]
"collectors/eci/parser.py" = ["E501"]
"collectors/eci/persist.py" = ["E501"]
"collectors/eci/validation.py" = ["E501"]
"tests/unit/test_archive_git.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["packages", "apps.api"]
